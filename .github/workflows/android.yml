name: ClipFlow Android Build

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*.*.*' ]
    paths:
      - 'android/**'
      - 'studio/**'
      - 'web/**'
      - '.github/workflows/android.yml'
  pull_request:
    branches: [ main, master ]
    paths:
      - 'android/**'
      - 'studio/**'
      - 'web/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Download Prebuilt ARM64 FFmpeg & FFprobe
        run: |
          mkdir -p android/app/src/main/jniLibs/arm64-v8a
          curl -fL --retry 3 --retry-delay 2 \
            -o android/app/src/main/jniLibs/arm64-v8a/libffmpeg.so \
            https://raw.githubusercontent.com/hzw1199/Android-FFmpeg-Prebuilt/main/ffmpeg-8.1.1/bin/ffmpeg
          curl -fL --retry 3 --retry-delay 2 \
            -o android/app/src/main/jniLibs/arm64-v8a/libffprobe.so \
            https://raw.githubusercontent.com/hzw1199/Android-FFmpeg-Prebuilt/main/ffmpeg-8.1.1/bin/ffprobe
          chmod +x android/app/src/main/jniLibs/arm64-v8a/libffmpeg.so android/app/src/main/jniLibs/arm64-v8a/libffprobe.so
          ls -lh android/app/src/main/jniLibs/arm64-v8a/

      - name: Download and Verify sherpa-onnx Android AAR
        run: |
          mkdir -p android/app/libs
          AAR_FILE="android/app/libs/sherpa-onnx-2.0.1.aar"
          EXPECTED_SHA256="a8d09d1d32f3eb8520482c6d3d43fae674681c5b050385967c70a3c2c9bf0ee7"
          echo "Downloading sherpa-onnx-2.0.1.aar..."
          curl -fL --retry 3 --retry-delay 2 \
            -o "$AAR_FILE" \
            https://github.com/k2-fsa/sherpa-onnx/releases/download/v2.0.1/sherpa-onnx-2.0.1.aar
          ACTUAL_SHA256=$(sha256sum "$AAR_FILE" | awk '{print $1}')
          if [ "$ACTUAL_SHA256" != "$EXPECTED_SHA256" ]; then
            echo "ERROR: Checksum mismatch for sherpa-onnx AAR!"
            echo "Expected: $EXPECTED_SHA256"
            echo "Actual:   $ACTUAL_SHA256"
            rm -f "$AAR_FILE"
            exit 1
          fi
          echo "Verified sherpa-onnx-2.0.1.aar checksum successfully ($ACTUAL_SHA256)"
          ls -lh "$AAR_FILE"

      - name: Build Android APKs (Debug & Release)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          cd android
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEY_ALIAS" ]; then
            echo "Building signed release APK..."
            echo "$KEYSTORE_BASE64" | base64 --decode > app/release.keystore
            ./gradlew assembleDebug assembleRelease --stacktrace \
              -Pandroid.injected.signing.store.file=release.keystore \
              -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
              -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
              -Pandroid.injected.signing.key.password="$KEY_PASSWORD"
          else
            echo "Building debug APK and unsigned release APK for verification..."
            ./gradlew assembleDebug assembleRelease --stacktrace
          fi

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ClipFlow-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ClipFlow-release-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30
