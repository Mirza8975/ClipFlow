<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0D111A">
  <title>Offline · ClipFlow</title>
  <link rel="icon" type="image/svg+xml" href="/brand/favicon.svg">
  <style>
    :root {
      --bg: #080B11;
      --frame: #0D111A;
      --frame-2: #121722;
      --line: #1E2536;
      --line-2: #283248;
      --brand: #6366F1;
      --brand-deep: #818CF8;
      --text: #F1F5F9;
      --dim: #94A3B8;
      --faint: #64748B;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%;
      height: 100dvh;
      background: var(--bg);
      color: var(--text);
      font: 15px/1.5 "Geist", "Segoe UI", system-ui, -apple-system, sans-serif;
      display: grid;
      place-items: center;
      padding: 24px;
      -webkit-font-smoothing: antialiased;
      -webkit-tap-highlight-color: transparent;
    }
    .offline-card {
      background: var(--frame-2);
      border: 1px solid var(--line-2);
      border-radius: 20px;
      padding: 36px 28px;
      max-width: 420px;
      width: 100%;
      text-align: center;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.5);
    }
    .logo {
      width: 56px;
      height: 56px;
      margin: 0 auto 20px;
      display: block;
    }
    .icon-wrap {
      width: 68px;
      height: 68px;
      border-radius: 50%;
      background: rgba(99, 102, 241, 0.12);
      border: 1px solid rgba(99, 102, 241, 0.28);
      display: grid;
      place-items: center;
      margin: 0 auto 20px;
      color: var(--brand-deep);
    }
    .icon-wrap svg {
      width: 32px;
      height: 32px;
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    h1 {
      font-size: 20px;
      font-weight: 700;
      color: #fff;
      margin-bottom: 8px;
      letter-spacing: -0.01em;
    }
    p {
      color: var(--dim);
      font-size: 14px;
      line-height: 1.5;
      margin-bottom: 24px;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      height: 44px;
      background: var(--brand);
      color: #fff;
      font-size: 14px;
      font-weight: 600;
      border: 0;
      border-radius: 10px;
      cursor: pointer;
      text-decoration: none;
      transition: background-color 0.15s ease, transform 0.1s ease;
    }
    .btn:hover {
      background: var(--brand-deep);
    }
    .btn:active {
      transform: scale(0.98);
    }
    .btn svg {
      width: 16px;
      height: 16px;
      stroke: currentColor;
      stroke-width: 2;
      fill: none;
    }
    .tip {
      font-size: 12px;
      color: var(--faint);
      margin-top: 18px;
    }
  </style>
</head>
<body>
  <main class="offline-card">
    <div class="icon-wrap">
      <svg viewBox="0 0 24 24">
        <line x1="1" y1="1" x2="23" y2="23"></line>
        <path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55"></path>
        <path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39"></path>
        <path d="M10.71 5.05A16 16 0 0 1 22.58 9"></path>
        <path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88"></path>
        <path d="M8.53 16.11a6 6 0 0 1 6.95 0"></path>
        <line x1="12" y1="20" x2="12.01" y2="20"></line>
      </svg>
    </div>
    <h1>You're currently offline</h1>
    <p>ClipFlow couldn't connect to the server. Check your internet connection and try again.</p>
    <button class="btn" onclick="window.location.reload()">
      <svg viewBox="0 0 24 24"><path d="M23 4v6h-6"></path><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path></svg>
      Retry Connection
    </button>
    <div class="tip">The app will automatically reconnect once your network is restored.</div>
  </main>
</body>
</html>
